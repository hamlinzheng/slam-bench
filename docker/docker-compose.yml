# slam-bench compose services — driven by ./bench.sh, not meant to be run by hand.
# Build context is the repo root so the Dockerfile can COPY docker/entrypoint.sh. The
# repo mounts at /slam-bench, per-system build output at ./.ws (gitignored, persists
# across runs), bags read-only from $BAGS_DIR.

# `network_mode` is per-service, not in this anchor — it is the isolation boundary.
x-common: &common
  image: slam-bench:noetic
  runtime: nvidia             # GPU/OpenGL passthrough so rviz can render (NVIDIA host)
  init: true                  # tini as PID 1 — forwards signals; without it a run cannot be stopped
  user: "${HOST_UID:-0}:${HOST_GID:-0}"   # bench.sh sets these; unset falls back to root-owned output
  working_dir: /slam-bench
  environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=graphics,display,utility
    - SYS                     # run service; unset is harmless elsewhere
    - BAG
    - RATE
    - NAME
    - DS                      # dataset name — compare / aggregate
    - MODE                    # evo plot mode (xy default|xyz|xz|yz)
    - RVIZ                    # true → rviz during a run (needs X11)
    - PRESET                  # configuration variant (default: default)
    - RUN                     # explicit run index (default: next free)
    - FORCE                   # true → let RUN overwrite an existing run directory
    - AGG_ARGS                # aggregate: extra flags for aggregate.py
    - ALL                     # compare: overlay every run, not just medians
    - REF                     # compare: whose frame to align the overlay in
    - ALIGN                   # compare: umeyama (default) | origin
    - GNSS                    # compare: also draw the GNSS-referenced overlay
    - PLOT                    # compare: true → also open a live window (X11 must reach the container)
    - OMP_WAIT_POLICY         # run_system.sh defaults it to `passive`; set `active` to override
  volumes:
    - ..:/slam-bench
    - ../.ws:/ws
    - ${BAGS_DIR:-../bags}:/bags:ro
    - /tmp/.X11-unix:/tmp/.X11-unix:rw

services:
  build:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: bash scripts/build_systems.sh

  # `$$` defers expansion to the container's shell; a single `$` is substituted by
  # compose from the HOST environment, for every service on every invocation.
  run:
    <<: *common
    # No network at all: a run's ROS lives entirely in this container and `none` still
    # gives it loopback, so neither the host's master nor another run can reach it.
    # See README, "Each run is network-isolated", for what that buys and what it costs.
    network_mode: none
    command: bash -c 'scripts/run_system.sh "$$SYS" "$$BAG"'

  # Prepares a dataset from its bags. Its own service because
  # it is the only step here that reads /bags, and both aggregate and compare consume
  # what it writes.
  init:
    <<: *common
    command: bash -c 'python3 eval/init_dataset.py /bags --out results/$$DS'

  compare:
    <<: *common
    command: bash -c 'python3 eval/compare.py "$$DS" "$${MODE:-xy}"'

  aggregate:
    <<: *common
    # Flags forwarded verbatim, so aggregate.py's argparse is the only place to declare one.
    command: bash -c 'python3 eval/aggregate.py results/$$DS $$AGG_ARGS'

  dev:
    <<: *common
    # Host network, unlike `run`: a by-hand shell onto the host's ROS graph. Not for runs.
    network_mode: host
    stdin_open: true
    tty: true
    command: bash
