# Override of PV-LIO/config/avia_indoor.yaml for the slam-bench rig. ONLY plumbing changed:
# topics, scan_line (Avia 6 -> MID-360 4) and the IMU-LiDAR extrinsic. pcd_save is already
# off upstream. All algorithm parameters are left at upstream defaults.
#
# Baselined on avia_indoor, not on avia_outdoor which upstream's mapping_avia.launch actually
# loads — a deliberate deviation from as-shipped, recorded in comparison_plan.md §2. The two
# differ only in down_sample_size (0.2 / 0.4) and voxel_size (0.25 / 2.0); a 2 m voxel is
# coarser than the underground drift we are measuring in.
common:
    lid_topic:  "/sensing/front/livox/lidar"
    imu_topic:  "/sensing/front/livox/imu"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible

preprocess:
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line: 4                 # CHANGED: was 6 (Avia) — MID-360 is 4-line
    scan_rate: 10
    blind: 0.5
    point_filter_num: 1

mapping:
    down_sample_size: 0.2
    max_iteration: 4
    voxel_size: 0.25
    max_layer: 4                # 4 layer, 0, 1, 2, 3
    layer_point_size: [ 5, 5, 5, 5, 5 ]
    plannar_threshold: 0.01
    max_points_size: 1000
    max_cov_points_size: 1000

    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]   # CHANGED: MID-360 factory nominal
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

noise_model:
    ranging_cov: 0.02
    angle_cov: 0.05
    acc_cov: 0.5
    gyr_cov: 0.25
    b_acc_cov: 0.0043
    b_gyr_cov: 0.000266

publish:
    pub_voxel_map: false
    publish_max_voxel_layer: 2         # only publish 0,1,2 layer's plane
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file;
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
