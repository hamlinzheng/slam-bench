# Output Adapter Table — the ONLY system-specific glue in the pipeline.
# Everything downstream (drift, map, resource metrics) reads the normalized artifacts
# and does not know which system produced them. scripts/run_system.sh currently mirrors
# the odom_topic / process fields here in a case statement; keep the two in sync (a
# future run_system reads this file directly — `disabled` below is the first field that
# already does, the rest are still mirrored).
#
# registered_cloud is not consumed yet (map artifact ② accumulation is a later stage);
# verify the exact topic name on first run before relying on it.
#
# `disabled: <reason>` — the one field here that IS read, by eval/registry.py: aggregate
# and compare then drop that system's runs and report the reason, while run warns and
# runs anyway. See eval/registry.py for why the reason is the value rather than a
# comment, and README, "Taking a system out of the comparison", for the full effect.

fast_lio:
  group: A                       # pure LIO odometry (no loop closure / backend)
  ws: /ws/fast_lio
  launch: configs/launch/fast_lio.launch
  odom_topic: /Odometry          # nav_msgs/Odometry, frame: camera_init
  registered_cloud: /cloud_registered
  process: fastlio_mapping

faster_lio:
  group: A
  ws: /ws/faster_lio
  launch: configs/launch/faster_lio.launch
  odom_topic: /Odometry          # nav_msgs/Odometry
  registered_cloud: /cloud_registered
  process: run_mapping_online

point_lio:
  group: A                       # pure LIO odometry; dual-mode, run in its shipped
                                 # default use_imu_as_input=0 (IMU as measurement)
  ws: /ws/point_lio
  launch: configs/launch/point_lio.launch
  odom_topic: /aft_mapped_to_init  # nav_msgs/Odometry (laserMapping.cpp:388)
  registered_cloud: /cloud_registered
  process: pointlio_mapping

super_lio:
  group: A                       # pure LIO odometry (ESKF + OctVoxMap hash map, no backend)
  ws: /ws/super_lio
  launch: configs/launch/super_lio.launch
  odom_topic: /lio/odom          # nav_msgs/Odometry, frame: world (ROSWrapper.cpp:210)
  registered_cloud: /lio/cloud_world
  process: super_lio_node

pv_lio:
  group: A                       # pure LIO odometry (probabilistic voxel map, no backend)
  ws: /ws/pv_lio
  launch: configs/launch/pv_lio.launch
  odom_topic: /Odometry          # nav_msgs/Odometry, frame: camera_init
  registered_cloud: /cloud_registered
  process: pv_lio_node

bievr_lio:
  group: A                       # pure LIO odometry (bump-image voxel map, no backend)
  ws: /ws/bievr_lio
  launch: configs/launch/bievr_lio.launch
  odom_topic: /bievr_lio/odom    # nav_msgs/Odometry; ns "bievr_lio" + topic "odom"
  registered_cloud: /bievr_lio/points/registered
  process: process_topics
